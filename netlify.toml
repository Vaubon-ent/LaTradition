[build]
  publish = "frontend"

# Redirection proxy /api/* vers le backend exposé via Tailscale Funnel
# (docs/plan-deploiement.md, mission D1 — URL obtenue sur BigBertha le
# 2026-11-07). Même origine côté navigateur (frontend/js/api.js utilise des
# chemins relatifs /api/*), donc pas de CORS à gérer côté client — status =
# 200 fait un vrai proxy, pas une redirection visible par le navigateur.
[[redirects]]
  from = "/api/*"
  to = "https://bigbertha.tail6f4387.ts.net/api/:splat"
  status = 200
  force = true
